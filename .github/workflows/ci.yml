name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.4"
          cache: true

      - name: format check
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      - name: unit tests
        run: go test -count=1 ./...

      - name: race tests
        run: go test -race -count=1 ./...

      - name: secret scan
        run: |
          p1='GOCSPX''-'
          p2='AIza''[0-9A-Za-z_-]{35}'
          p3='AKIA''[0-9A-Z]{16}'
          p4='ya29''\.[0-9A-Za-z_-]+'
          p5='-----BEGIN (RSA |EC |OPENSSH )?PRIVATE ''KEY-----'
          pattern="(${p1}|${p2}|${p3}|${p4}|${p5})"

          # Self-test scanner against a temporary fixture without printing secrets.
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          printf 'token=%s\n' "${p1}example_fixture_12345" > "$tmp_dir/fixture.txt"
          if ! grep -rnEl "$pattern" "$tmp_dir" >/dev/null; then
            echo "secret scanner self-test failed to detect fixture"
            exit 1
          fi

          if matches="$(grep -rnEl "$pattern" --exclude-dir=.git --exclude-dir=.codebase-graph .)"; then
            echo "potential secret detected in:"
            echo "$matches"
            exit 1
          fi

  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: validate compose files
        run: make compose-check

  integration:
    runs-on: ubuntu-latest
    needs: [unit-and-lint, compose-validate]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.4"
          cache: true

      - name: start isolated infrastructure
        run: make infra-up

      - name: wait for api readiness
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8083/readyz; then
              echo ""
              exit 0
            fi
            sleep 3
          done
          docker compose -p it-news-shorts -f deployments/docker-compose.yml logs
          exit 1

      - name: verify migrations idempotency
        run: |
          make migrate-up
          make migrate-up

      - name: run integration tests
        run: make test-integration

      - name: run smoke test
        run: make smoke-test

      - name: tear down infrastructure
        if: always()
        run: make infra-down
