name: it-news-shorts

networks:
  it_news_net:
    driver: bridge

volumes:
  postgres_data:
  minio_data:

services:
  postgres:
    image: postgres:16.16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-postgres_local_dev}
      POSTGRES_DB: postgres
      APP_DB_NAME: ${POSTGRES_DB:-it_news}
      APP_DB_USER: ${POSTGRES_USER:-it_news_app}
      APP_DB_PASSWORD: ${POSTGRES_PASSWORD:-it_news_local_dev}
      TEMPORAL_DB_USER: ${TEMPORAL_DB_USER:-temporal}
      TEMPORAL_DB_PASSWORD: ${TEMPORAL_DB_PASSWORD:-temporal_local_dev}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-dbs.sh:/docker-entrypoint-initdb.d/01-init-dbs.sh:ro
    networks:
      - it_news_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER:-postgres} -d ${POSTGRES_DB:-it_news}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 512M

  temporal-init:
    image: temporalio/admin-tools:1.32.2
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_SEEDS: postgres
      DB_PORT: 5432
      POSTGRES_USER: ${TEMPORAL_DB_USER:-temporal}
      POSTGRES_PWD: ${TEMPORAL_DB_PASSWORD:-temporal_local_dev}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        temporal-sql-tool --plugin postgres12 --ep "$$POSTGRES_SEEDS" -p "$$DB_PORT" -u "$$POSTGRES_USER" -pw "$$POSTGRES_PWD" --db temporal setup-schema -v 0.0 || true
        temporal-sql-tool --plugin postgres12 --ep "$$POSTGRES_SEEDS" -p "$$DB_PORT" -u "$$POSTGRES_USER" -pw "$$POSTGRES_PWD" --db temporal update-schema -d /etc/temporal/schema/postgresql/v12/temporal/versioned
        temporal-sql-tool --plugin postgres12 --ep "$$POSTGRES_SEEDS" -p "$$DB_PORT" -u "$$POSTGRES_USER" -pw "$$POSTGRES_PWD" --db temporal_visibility setup-schema -v 0.0 || true
        temporal-sql-tool --plugin postgres12 --ep "$$POSTGRES_SEEDS" -p "$$DB_PORT" -u "$$POSTGRES_USER" -pw "$$POSTGRES_PWD" --db temporal_visibility update-schema -d /etc/temporal/schema/postgresql/v12/visibility/versioned
    networks:
      - it_news_net

  temporal:
    image: temporalio/server:1.32.2
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      temporal-init:
        condition: service_completed_successfully
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: ${TEMPORAL_DB_USER:-temporal}
      POSTGRES_PWD: ${TEMPORAL_DB_PASSWORD:-temporal_local_dev}
      SKIP_SCHEMA_SETUP: "true"
      SKIP_DB_CREATE: "true"
      BIND_ON_IP: 0.0.0.0
      TEMPORAL_BROADCAST_ADDRESS: 127.0.0.1
    volumes:
      - ./temporal/dynamicconfig.yaml:/etc/temporal/config/dynamicconfig/docker.yaml:ro
    ports:
      - "127.0.0.1:${TEMPORAL_PORT:-7233}:7233"
    networks:
      - it_news_net
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 7233 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1G

  temporal-ui:
    image: temporalio/ui:2.58.1
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "127.0.0.1:${TEMPORAL_UI_PORT:-8082}:8080"
    networks:
      - it_news_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
    deploy:
      resources:
        limits:
          memory: 256M

  minio:
    image: cgr.dev/chainguard/minio@sha256:96b6cf3e14084d3427ec46de10c2873af61b945ad9272eec266cfc8df551cba5
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin_dev}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin_dev_pass}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks:
      - it_news_net
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /minio/health/live HTTP/1.1\\r\\nHost: 127.0.0.1:9000\\r\\nConnection: close\\r\\n\\r\\n' >&3 && IFS= read -r line <&3 && [[ \"$$line\" == *200* ]]"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 512M

  minio-init:
    image: cgr.dev/chainguard/minio-client@sha256:2e433473835685d7daf6a266dbbf44fc9d5479b24cb351b7d170492f4fe971d4
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin_dev}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin_dev_pass}
      MINIO_BUCKET: ${MINIO_BUCKET:-it-news-media}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -eu
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$MINIO_BUCKET"
        mc anonymous set none "local/$$MINIO_BUCKET"
    networks:
      - it_news_net

  api:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
      target: api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TZ: ${TZ:-Europe/Moscow}
      API_LISTEN_ADDR: :8081
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-it_news}
      POSTGRES_USER: ${POSTGRES_USER:-it_news_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-it_news_local_dev}
      POSTGRES_SSLMODE: disable
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin_dev}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin_dev_pass}
      MINIO_BUCKET: ${MINIO_BUCKET:-it-news-media}
      MINIO_USE_SSL: "false"
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-it-news}
      TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-IT_NEWS_QUEUE}
    ports:
      - "127.0.0.1:${API_PORT:-8083}:8081"
    networks:
      - it_news_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  worker:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
      target: worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TZ: ${TZ:-Europe/Moscow}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
      WORKER_METRICS_ADDR: :9090
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-it_news}
      POSTGRES_USER: ${POSTGRES_USER:-it_news_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-it_news_local_dev}
      POSTGRES_SSLMODE: disable
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin_dev}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin_dev_pass}
      MINIO_BUCKET: ${MINIO_BUCKET:-it-news-media}
      MINIO_USE_SSL: "false"
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-it-news}
      TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-IT_NEWS_QUEUE}
    networks:
      - it_news_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
